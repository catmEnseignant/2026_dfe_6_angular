<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col-4">
                <h3> Médecins </h3>
            </div>
            <div class="col-5">
                <input class="col-3 form-control me-2" placeholder="Medecins" type="search"  aria-label="Search"/>
            </div>
            <div class="col-3">
                <button (click)="insertMedecin()" class="col btn btn-outline-success" >Ajouter un medecin</button>
            </div>
        </div>
    </div>

    <div class="card-body">
        <table class="table">
            <thead class="table-dark">
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Prenom</th>
                    <th scope="col">Nom</th>
                    <th scope="col">Email</th>
                    <th scope="col">Telephone</th>
                    <th scope="col">Fonction</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            
            <tbody>
                @for(item of medecins; track $index ){
                    <tr>
                        <th scope="row">{{ item.id }}</th>
                        <td>{{ item.prenom }}</td>
                        <td>{{ item.nom }}</td>
                        <td> {{ item.email }} </td>
                        <td> {{ item.telephone }} </td>
                        <td> {{ item.fonction }} </td>
                        <td class="d-flex gap-2">
                            <button class="btn btn-success" (click) = "editMedecin(item)">
                                <i class="bi bi-pencil"></i>
                                Edit
                            </button>
                            <button class="btn btn-danger" (click) = "deleteMedecin(item.id)">
                                <i class="bi bi-trash3"></i>
                                Delete
                            </button>
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
