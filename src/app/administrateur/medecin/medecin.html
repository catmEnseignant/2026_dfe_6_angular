<p>medecin works!</p>

<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col-5">
                
            </div>
            <div class="col-6">
                <input class="form-control mr-sm-2" type="search" [placeholder]="" aria-label="Search">
                <button (click)="ajoutmedecin()" class="btn btn-outline-success my-2 my-sm-0" type="submit">Ajouter un medecin</button>

            </div>
            
            
        </div>
        
    </div>
    <div class="card-body">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Prenom</th>
                    <th scope="col">Nom</th>
                    <th scope="col">Email</th>
                    <th scope="col">Specialite</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                @for (item of medecin ;track $index){
                    <tr>
                        <th scope="row">{{$index+1}}</th>
                        <td>{{item.prenom}}</td>
                        <td>{{item.nom}}</td>
                        <td>{{item.email}}</td>
                        <td>{{item.specialite}}</td>
                        <td>
                            <button (click)="modifieMedecin(item.id)">
                                <i class="bi bi-pencil-square"></i>
                                modifier
                            </button>
                            <button (click)="deleteMedecin(item.id)">
                                <i class="bi bi-info-circle"></i>
                                supprimer
                            </button>

                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
