<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col-5">
                @if (title == 'Patients') {
                    <h3 >{{ title }}</h3> 
                } @else {
                    <h3> Titre introuvable </h3>
                }
            </div>
            <div class="col-5">
                <input class="col-3 form-control me-2" type="search" [placeholder]= "title" aria-label="Search"/>
            </div>
            <div class="col-2">
                <button (click)="getInfoPatient()" class="col btn btn-outline-success">Ajouter un patient</button>
            </div>
        </div>
    </div>

    <div class="card-body">
        <table class="table">
            <thead class="table-dark">
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Prenom</th>
                    <th scope="col">Nom</th>
                    <th scope="col">Email</th>
                    <th scope="col">Age</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            
            <tbody>
                @for(item of patients2.data;track $index) {
                    <tr>
                        <th scope="row">{{ item.id }}</th>
                        <td>{{ item.prenom }}</td>
                        <td>{{ item.nom }}</td>
                        <td> {{ item.email }} </td>
                        <td> {{ item.telephone }} </td>
                        <td class="d-flex gap-2">
                            <button class="btn btn-success" (click)="editPatient(item)">
                                <i class="bi bi-pencil"></i>
                                Edit
                            </button>
                            <button class="btn btn-danger" (click)="deletePatient(item.id)">
                                <i class="bi bi-trash3"></i>
                                Delete
                            </button>
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
