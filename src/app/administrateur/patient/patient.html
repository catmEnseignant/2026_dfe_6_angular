<div class="card">
  <div class="card-header">
    <div class="row align-items-center">
      <div class="col-6">
        <h4>{{ title }}</h4>
      </div>
      <div class="col-6 text-end">
        <button class="btn btn-success" type="button" (click)="insertPatient()">
          Ajouter un patient
        </button>
      </div>
    </div>
  </div>
  <div class="card-body">
    
    <div *ngIf="!loading && patients.length === 0" class="text-center py-4">
      Aucun patient trouvé.
    </div>
    <table *ngIf="!loading && patients.length > 0" class="table table-striped table-hover">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Prénom</th>
          <th scope="col">Nom</th>
          <th scope="col">Email</th>
          <th scope="col">Date de naissance</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody class="table-group-divider">
        <tr *ngFor="let patient of patients; let i = index; trackBy: trackById">
          <th scope="row">{{ i + 1 }}</th>
          <td>{{ patient.prenom }}</td>
          <td>{{ patient.nom }}</td>
          <td>{{ patient.email }}</td>
          <td>{{ patient.dateNaissance || '-' }}</td>
          <td>
            <button class="btn btn-sm btn-primary me-2" type="button" (click)="editPatient(patient)">Modifier</button>
            <button class="btn btn-sm btn-danger" type="button" (click)="deletePatient(patient)">Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
