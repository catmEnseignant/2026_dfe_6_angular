<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-dark text-white">
      <h4 class="mb-0">{{ formTitle }}</h4>
    </div>

    <div class="card-body">
      <form [formGroup]="formPatient" (ngSubmit)="submitForm()">

        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Nom</label>
            <input type="text" class="form-control" placeholder="Entrez le nom" formControlName="nom" />
          </div>

          <div class="col-md-6">
            <label class="form-label">Prénom</label>
            <input type="text" class="form-control" placeholder="Entrez le prénom" formControlName="prenom">
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="exemple@mail.com" formControlName="email">
          </div>
          <div class="col-md-6">
            <label class="form-label">Date de naissance</label>
            <input type="date" class="form-control" formControlName="dateNaissance">
          </div>
        </div>





        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-success me-2" [disabled]="loading">
            {{ submitLabel }}
          </button>
          <button type="button" class="btn btn-outline-primary" (click)="cancel()" [disabled]="loading">
            Retour à la liste des patients
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
