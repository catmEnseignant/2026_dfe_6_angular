<form [formGroup] = "formPatient" (ngSubmit)="inputFormPatient()">
  <div class="row">
    <div class="row">
      <div class="form-group col-md-6">
      <label for="inputPrenom">prenom</label>
      <input type="text" class="form-control" id="inputPrenom" formControlName ="prenom"  placeholder="Prenom">
    </div>
    <div class="form-group col-md-6">
      <label for="inputNom">Nom</label>
      <input type="text" class="form-control" id="inputNom" formControlName ="nom" placeholder="Nom">
    </div>
    </div>
    
  </div>

 <div class="row">
    <div class="form-group  col-md-6">
          <label for="inputEmail">email</label>
          <input type="email" class="form-control" id="inputEmail" formControlName ="email" placeholder="Email">
      </div>
      <div class="form-group  col-md-6">
          <label for="inputAge">age</label>
          <input type="text" class="form-control" id="inputAge" formControlName ="age" placeholder="Age">
      </div>
  </div>


  
 
  <button type="submit" class="btn btn-primary">Ajouter le patient</button>
</form>
