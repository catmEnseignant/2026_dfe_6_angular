

<form [formGroup]="formPatient" (ngSubmit)="inputFormPatient()">
  <div class="form-group" col-md-6>
    <label for="exampleInputEmail1">Prenom</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Prenom">
    <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</small>
  </div>
  <div class="form-group" col-md-6>
    <label for="exampleInputPassword1">Nom</label>
    <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Nom">
  </div>
  <div class="form-group" col-md-6>
    <label for="exampleInputPassword1">Email</label>
    <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Email">
  </div>
  <div class="form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1">
    <label class="form-check-label" for="exampleCheck1">Check me out</label>
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
