
<form [formGroup]="formMedecin" (ngSubmit)="inputFormMedecin()">
  <div class="container mt-5">
    <div class="card shadow-lg p-4">

      <h3 class="text-center mb-4">Ajouter un médecin</h3>

      <div class="form-group mb-3">
        <label>Nom</label>
        <input type="text" class="form-control" formControlName="nom" placeholder="Nom">
      </div>

      <div class="form-group mb-3">
        <label>Prénom</label>
        <input type="text" class="form-control" formControlName="prenom" placeholder="Prénom">
      </div>

      <div class="form-group mb-3">
        <label>Email</label>
        <input type="email" class="form-control" formControlName="email" placeholder="Email">
      </div>

      <div class="form-group mb-3">
        <label>Spécialité</label>
        <input type="text" class="form-control" formControlName="specialite" placeholder="Spécialité">
      </div>

      <div class="form-group mb-3">
        <button type="submit" class="btn btn-success">
          Enregistrer
        </button>
      </div>

    </div>
  </div>
</form>
