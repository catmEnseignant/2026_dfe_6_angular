<div class="card">
    <div class="card-header">
        <h3>Ajouter un medecin</h3>
    </div>

    <div class="card-body">
        <form [formGroup] = "formMedecin" (ngSubmit) = "inputFormMedecin()">
            <div class="row">
                <div class="col-6 mb-3">
                    <label for="nom" class="form-label">Nom</label>
                    <input type="text" placeholder="Entrer votre nom" formControlName="nom" id="nom" class="form-control" aria-describedby="passwordHelpBlock">
                </div>
                <div class="col-6 mb-3">
                    <label for="prenom" class="form-label">Prenom</label>
                    <input type="text" placeholder="Entrer votre prenom" formControlName="prenom" id="prenom" class="form-control" aria-describedby="passwordHelpBlock">
                </div>
            </div>

            <div class="row">
                
                <!-- formControlName comme name en php -->
                <div class="col-6 mb-3">
                    <label for="tel" class="form-label">Telephone</label>
                    <input type="text" placeholder="Entrer votre numero de telephone" formControlName="telephone" class="form-control" id="tel">
                </div>
                <div class="col-6 mb-3">
                    <label for="fonction" class="form-label">Fonction</label>
                    <input type="text" placeholder="Entrer votre fonction" formControlName="fonction" class="form-control" id="fonction">
                </div>
            </div>
            
            <div class="col-12 mb-3">
                <label for="exampleInputEmail1" class="form-label">Email address</label>
                <input type="email" placeholder="Entrer votre email" formControlName="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
            </div>
            <button type="submit" class="btn btn-primary pl-50">Enregistrer</button>
        </form>
    </div>
</div>
