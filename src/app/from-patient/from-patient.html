<div class="card">
    <div class="card-header">
        <h3>Ajouter un patient</h3>
    </div>

    <div class="card-body">
        <form [formGroup]="formPatient" (ngSubmit)="inputFormpatient()">
            <div class="row">
                <div class="col-6 mb-3">
                    <label for="nom" class="form-label">Nom</label>
                    <input type="text" formControlName="nom" id="nom" class="form-control" aria-describedby="passwordHelpBlock">
                </div>
                <div class="col-6 mb-3">
                    <label for="prenom" class="form-label">Prenom</label>
                    <input type="text" formControlName="prenom" id="prenom" class="form-control" aria-describedby="passwordHelpBlock">
                </div>
            </div>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email</label>
                <input type="email" formControlName="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
            </div>
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Age</label>
                <input type="number" formControlName="age" class="form-control" id="exampleInputPassword1">
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" formControlName="consent" class="form-check-input" id="exampleCheck1">
                <label class="form-check-label" for="exampleCheck1">Check me out</label>
            </div>
            <button type="submit" class="btn btn-primary pl-50">Submit</button>
        </form>
    </div>
</div>
