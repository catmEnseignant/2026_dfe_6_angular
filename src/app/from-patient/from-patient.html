<form class="row row-cols-lg-auto g-3 align-items-center">
  <div class="col-12">
    <form class="row row-cols-lg-auto g-3 align-items-center p-3 border rounded shadow" style="max-width: 600px; margin:auto;">
  
  <!-- Nom -->
  <div class="col-12">
    <label class="visually-hidden" for="nomInput">Nom</label>
    <div class="input-group">
      <div class="input-group-text">@</div>
      <input type="text" class="form-control border-primary" id="nomInput" placeholder="Nom">
    </div>
  </div>

  <!-- Prénom -->
  <div class="col-12">
    <label class="visually-hidden" for="prenomInput">Prénom</label>
    <div class="input-group">
      <div class="input-group-text">@</div>
      <input type="text" class="form-control border-primary" id="prenomInput" placeholder="Prénom">
    </div>
  </div>

  <!-- Email -->
  <div class="col-12">
    <label class="visually-hidden" for="emailInput">Email</label>
    <div class="input-group">
      <div class="input-group-text">@</div>
      <input type="email" class="form-control border-primary" id="emailInput" placeholder="Email">
    </div>
  </div>

  <!-- Bouton -->
  <div class="col-12">
    <button type="submit" class="btn btn-primary w-100">Envoyer</button>
  </div>

</form>
