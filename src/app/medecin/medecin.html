<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h4 class="mb-0">Médecins</h4>
    <button class="btn btn-success" type="button" (click)="insertMedecin()">Ajouter un médecin</button>
  </div>
  <div class="card-body">
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>#</th>
          <th>Prénom</th>
          <th>Nom</th>
          <th>Spécialité</th>
          <th>Email</th>
          <th>Téléphone</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let medecin of medecins$ | async; let i = index; trackBy: trackById">
          <th scope="row">{{ i + 1 }}</th>
          <td>{{ medecin.prenom }}</td>
          <td>{{ medecin.nom }}</td>
          <td>{{ medecin.specialite }}</td>
          <td>{{ medecin.email }}</td>
          <td>{{ medecin.telephone || '-' }}</td>
          <td>
            <button class="btn btn-sm btn-primary me-2" type="button" (click)="editMedecin(medecin)">Modifier</button>
            <button class="btn btn-sm btn-danger" type="button" (click)="deleteMedecin(medecin)">Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
