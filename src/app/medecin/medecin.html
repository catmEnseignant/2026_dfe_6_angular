
<div class="card">
  <div class="card-header">
    <div class="row">

      <div class="col-5">
        <h5>Liste des médecins</h5>
      </div>

      <div class="col-4">
        <button class="btn btn-outline-success" (click)="getInfoMedecin()">
          Ajouter un médecin
        </button>
      </div>

    </div>
  </div>

  <div class="card-body">
    <table class="table">
      <thead>
        <tr>
          <th>#</th>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Email</th>
          <th>Spécialité</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        @for (medecin of tableauMedecins ; track medecin.id) {
          <tr>
            <th scope="row">{{$index + 1}}</th>
            <td>{{medecin.nom}}</td>
            <td>{{medecin.prenom}}</td>
            <td>{{medecin.email}}</td>
            <td>{{medecin.specialite}}</td>

            <td>
              <button class="btn btn-primary" (click)="editMedecin(medecin)">
                Editer
              </button>

              <button class="btn btn-danger" (click)="deleteMedecin(medecin.id)">
                Supprimer
              </button>
            </td>
          </tr>
        }

        @empty {
          <tr>
            <td colspan="6" class="text-center">
              Aucun médecin trouvé
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
