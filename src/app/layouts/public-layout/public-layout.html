<div class="layout-container">
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-content">
      <div class="navbar-brand">
        <div class="brand-copy">
          <h2 class="logo">🏥 MediCare</h2>
          <p class="brand-tagline">Gestion médicale rapide et claire</p>
        </div>
      </div>

      <div class="navbar-actions">
        <ul class="navbar-menu">
          <li>
            <a
              routerLink="/accueil"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              >Accueil</a
            >
          </li>
          <li>
            <a routerLink="/auth" routerLinkActive="active">Se connecter</a>
          </li>
        </ul>
        <a routerLink="/register" class="btn btn-navbar">S'inscrire</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <p>&copy; 2026 MediCare. Tous droits réservés.</p>
      <p>Votre santé est notre priorité</p>
    </div>
  </footer>
</div>
