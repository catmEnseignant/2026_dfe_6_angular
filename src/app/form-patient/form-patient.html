<form [formGroup]="formPatient" (ngSubmit)="inputFormPatient()">
  <div class="container mt-5">
    <div class="card shadow-lg p-4">
      <h3 class="text-center mb-4">Ajouter un patient</h3>

      <div class="form-group mb-3">
        <label class="form-label">Nom</label>
        <input type="text" class="form-control" formControlName="nom" placeholder="Entrez le nom">
      </div>

      <div class="form-group mb-3">
        <label class="form-label">Prénom</label>
        <input type="text" class="form-control" formControlName="prenom" placeholder="Entrez le prénom">
      </div>

      <div class="form-group mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email" placeholder="exemple@mail.com">
      </div>

      <div class="form-group mb-3">
        <label class="form-label">Age</label>
        <input type="number" class="form-control" formControlName="age" placeholder="Entrez l'âge">
      </div>

      <div class="form-group mb-3">
        <button type="submit" class="btn btn-success">Enregistrer</button>
      </div>
    </div>
  </div>
</form>
