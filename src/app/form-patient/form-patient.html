<form [formGroup]="FormPatient" (ngSubmit)="inputFormPatient()">
  <div class="form-group col-md-6">
    <label for="exampleInputPrenom" class="form-label">Prenom</label>
    <input type="text" class="form-control" id="exampleInputPrenom" formControlName="prenom">
  </div>

  <div class="form-group col-md-6">
    <label for="exampleInputNom" class="form-label">Nom</label>
    <input type="text" class="form-control" id="exampleInputNom" formControlName="nom">
  </div>

  <div class="form-group col-md-6">
    <label for="exampleInputEmail" class="form-label">Email</label>
    <input type="email" class="form-control" id="exampleInputEmail" formControlName="email">
  </div>

  <div class="form-group col-md-6">
    <label for="exampleInputAge" class="form-label">Age</label>
    <input type="number" class="form-control" id="exampleInputAge" formControlName="age">
  </div>

  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1">
    <label class="form-check-label" for="exampleCheck1">Check me out</label>
  </div>
  <button type="submit" class="btn btn-primary">Envoyer</button>
</form>
