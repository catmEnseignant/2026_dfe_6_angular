<a href="/patient"></a>
<form [formGroup]="FormPatient" (ngSubmit)="inputformPatient()">
  <div class="mb-3">
    <label for="nom" class="form-label">Nom:</label>
    <input type="text" class="form-control" id="nom" formControlName="nom" aria-describedby="nomHelp">
    <div id="nomHelp" class="form-text"></div>
  </div>

  <div class="mb-3">
    <label for="prenom" class="form-label">Prenom:</label>
    <input type="text" class="form-control" id="prenom" formControlName="prenom">
  </div>

  <div class="mb-3">
    <label for="email" class="form-label">Email:</label>
    <input type="email" class="form-control" id="email" formControlName="email">
  </div>

  <div class="mb-3">
    <label for="age" class="form-label">Age:</label>
    <input type="number" class="form-control" id="age" formControlName="age">
  </div>

  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1">
    <label class="form-check-label" for="exampleCheck1">souvenir de moi</label>
  </div>

  <button type="submit" class="btn btn-primary" [disabled]="!FormPatient.valid">Submit</button>
  <a href="/patient" class="btn btn-secondary">retour a la liste des patients</a>
</form>
