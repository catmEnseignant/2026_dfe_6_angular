
<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col-5">
                @if (title =='patients') {
                    <h3>{{title}}</h3>
                }@else {
                    <h3>Titre introuvable </h3>
                }
            </div>
            <div class="col-6">
                <input class="form-control mr-sm-2" type="search" [placeholder]="getEmail()" aria-label="Search">
                <button (click)=" getInfoPatient()" class="btn btn-outline-success my-2 my-sm-0" type="submit">Ajouter un Patient</button>
            </div>
            
        </div>
        
    </div>
    <div class="card-body">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Prenom</th>
                    <th scope="col">Nom</th>
                    <th scope="col">Email</th>
                </tr>
            </thead>
            <tbody>
                @for (item of Patients ;track $index){
                    <tr>
                        <th scope="row">{{$index+1}}</th>
                        <td>{{item.prenom}}</td>
                        <td>{{item.nom}}</td>
                        <td>{{item.email}}</td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
