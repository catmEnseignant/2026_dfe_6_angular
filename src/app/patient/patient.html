<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-5">
        <h5>{{tittle}}</h5>
      </div>
      <div class="col-3">
        <input class="form-control mr-sm-2" type="search" placeholder="{{getEmail()}}" aria-label="Search">
      </div>
      <div class="col-4">
        <button class="btn btn-outline-success" (click)="getInfosPatient()">Ajouter un patient</button>
      </div>

    </div>
  </div>
</div>

<div class="card-body">
  <table class="table">
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Nom</th>
        <th scope="col">Prenom</th>
        <th scope="col">Email</th>
        <th scope="col">Action</th>



      </tr>



    </thead>
    <tbody>
      @for(item of tableauPatients2; track $index){
      <tr>
        <th scope="row">{{$index + 1}}</th>
        <td>{{item.prenom}}</td>
        <td>{{item.nom}}</td>
        <td>{{item.email}}</td>
        <td>
          <button class="btn btn-primary" (click)="EditPatient(item)">

            Editer
          </button>
        </td>



      </tr>
      }
    </tbody>
  </table>
</div>
