<div class="card">
  <div class="card-header">
    <div class="row">

      <!-- titre -->
      <div class="col-5">
        <h5>Liste des patients</h5>
      </div>

      <div class="col-3">
        <input class="form-control me-2" type="search" [placeholder]="getEmail()" />
      </div>

      <div class="col-4">
        <button class="btn btn-outline-success" (click)="getInfoPatient()">
          Ajouter un patient
        </button>
      </div>

    </div>
  </div>

  <div class="card-body">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Nom</th>
          <th scope="col">Prénom</th>
          <th scope="col">Email</th>
          <th scope="col">Age</th>
          <th scope="col">Action</th>
          
        </tr>
      </thead>

      <tbody>
        <!-- affichage dynamique -->
        @for (patient of tableauPatients2 ; track patient.id) {
          <tr>
            <th scope="row">{{$index + 1}}</th>
            <td>{{patient.nom}}</td>
            <td>{{patient.prenom}}</td>
            <td>{{patient.email}}</td>
            <td>{{patient.age}}</td>
            <td>
             <button class="btn btn-primary"(click)="editPatient(patient)">
               Editer
             </button>
            </td>
          </tr>
        }

        <!-- données statiques de test -->
        <tr>
          <th scope="row">{{getSomme(2, 3)}}</th>
          <td>Jacob</td>
          <td>Thornton</td>
          <td>@fat</td>
        </tr>

        <tr>
          <th scope="row">{{getEmail()}}</th>
          <td>John</td>
          <td>Doe</td>
          <td>@social</td>
        </tr>

      </tbody>
    </table>
  </div>
</div>
