<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-5">{{title}}</div>
      <div class="col-3">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
      </div>
      <div class="col-4">
        <a href="/direction" class="btn btn-outline-success">Ajouter un patient</a>
      </div>
    </div>
  </div>

</div>
<table class="table">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Prenom</th>
      <th scope="col">Nom</th>
      <th scope="col">Email</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row">{{3*nombrePatients}}</th>
      <td>{{prenom}}</td>
      <td>{{nom}}</td>
      <td>{{email}}</td>
    </tr>
    <tr>
      <th scope="row">{{getSomme(2, 3)}}</th>
      <td>Jacob</td>
      <td>Thornton</td>
      <td>@fat</td>
    </tr>
    <tr>
      <th scope="row">3</th>
      <td>John</td>
      <td>Doe</td>
      <td>{{getEmail()}}</td>
    </tr>
  </tbody>
</table>
