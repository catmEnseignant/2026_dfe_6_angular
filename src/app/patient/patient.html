<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col-5">
              @if(title == 'Patients'){
                 <h5>{{title}}</h5>
              }
              @else{
                 <h5>Titre introuvable</h5>
              }
            </div>
            <div class="col-6">
                <input class="form-control me-2" type="search" placeholder={{getEmail()}} aria-label="Search">
            </div>
            <div class="col-4">
                <button class="btn btn-outline-success" (click)="getInfoPatient()">Ajouter un patient</button>
            </div>
        </div>
        </div>
    <div class="card-body">
<table class="table">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">prenom</th>
      <th scope="col">nom</th>
      <th scope="col">email</th>
    </tr>
  </thead>
  <tbody>
    @for(item of tableauPatients2; track $index){
    <tr>
      <th scope="row">{{$index + 1}}</th>
      <td>{{item.prenom}}</td>
      <td>{{item.nom}}</td>
      <td>{{item.email}}</td>
    </tr>
  }
  </tbody>
</table>

    </div>
</div>
