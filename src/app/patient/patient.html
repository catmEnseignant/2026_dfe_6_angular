<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col-5">
                @if(title == "Patient"){
                    <h4>{{ title }}</h4>
                } @else {
                    <h4>Texte Introuvable</h4>
                }
            </div>
            <div class="col-7 d-flex justify-content-end">
                <input class="form-control me-2" type="search" [placeholder]="GetNom()" aria-label="Search">
                <button class="btn btn-outline-success" type="button" (click)="GetInfoPatient()">Ajouter</button>
            </div>
        </div>
    </div>
    <div class="card-body">
        <table class="table table-striped table-hover">
        <thead>
            <tr>
            <th scope="col">#</th>
            <th scope="col">Nom</th>
            <th scope="col">Prenom</th>
            <th scope="col">Email</th>
            </tr>
        </thead>
        <tbody class="table-group-divider">
            @for(item of tableauPatients2;track $index){
                <tr>
                    <th scope="row">{{ $index+1 }}</th>
                    <td>{{ item.nom }}</td>
                    <td>{{ item.prenom }}</td>
                    <td>{{ item.email }}</td>
                </tr>
            }
        </tbody>
        </table>
    </div>
</div>
