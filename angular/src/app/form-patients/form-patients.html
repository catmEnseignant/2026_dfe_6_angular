<div class="card shadow-sm">

  <div class="card-header bg-primary text-white">
    <h4>➕ Ajouter un patient</h4>
  </div>

  <div class="card-body">

    <form [formGroup]="formPatient" (ngSubmit)="inputFormPatient()">

      <input class="form-control mb-2" formControlName="nom" placeholder="Nom">
      <input class="form-control mb-2" formControlName="prenom" placeholder="Prénom">
      <input class="form-control mb-2" formControlName="email" placeholder="Email">
      <input class="form-control mb-2" type="number" formControlName="age" placeholder="Âge">

      <button class="btn btn-success w-100" type="submit">
        💾 Enregistrer
      </button>

    </form>

  </div>
</div>
