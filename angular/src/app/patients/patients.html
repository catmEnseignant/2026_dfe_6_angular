<div class="card shadow border-0 mt-4">

  <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
    <h5 class="mb-0">📋 Liste des patients</h5>

    <a routerLink="/formulaire" class="btn btn-success rounded-pill">
      ➕ Ajouter
    </a>
  </div>

  <div class="card-body">

    <table class="table table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Prénom</th>
          <th>Nom</th>
          <th>Email</th>
          <th>Age</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of patients2; let i = index">
          <td>{{i + 1}}</td>
          <td>{{item.prenom}}</td>
          <td>{{item.nom}}</td>
          <td>{{item.email}}</td>
          <td>{{item.age}}</td>
        </tr>
      </tbody>
    </table>

  </div>
</div>
